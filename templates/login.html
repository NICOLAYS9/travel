{% extends "base.html" %} {% block title %}Login - TravelExpense Pro{%
endblock %} {% block content %}
<div class="login-shell">
  <div class="login-card">
    <div class="brand-mark">T</div>
    <h1>Sign in to TravelExpense</h1>

    <form method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-control"
          required
          autofocus
        />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          required
        />
      </div>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
